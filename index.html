<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngalula Beauty Spa Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ngalula Beauty Spa Inventory System</h1>
    <form id="clientForm">
      <label for="name">Client Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" required>

      <label for="birthday">Birthday:</label>
      <input type="date" id="birthday" required>

      <label for="paymentMethod">Payment Method:</label>
      <select id="paymentMethod" required>
        <option value="">Select payment method</option>
        <option value="cash">Cash</option>
        <option value="mobileMoney">Mobile Money</option>
        <option value="card">Card</option>
      </select>

      <h3>Services</h3>
      <div id="servicesList">
        <div class="service-item">
          <input type="checkbox" name="services" value="Facial" data-price="150"> Facial (150 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
        <div class="service-item">
          <input type="checkbox" name="services" value="Massage" data-price="200"> Massage (200 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
      </div>
      <button type="button" onclick="addService()">Add Service</button>

      <h3>Therapists</h3>
      <div id="therapistsList">
        <div class="therapist-item">
          <input type="checkbox" name="therapists" value="Therapist 1"> Therapist 1
          <button type="button" class="delete-btn" onclick="deleteTherapist(this)">Delete</button>
        </div>
        <div class="therapist-item">
          <input type="checkbox" name="therapists" value="Therapist 2"> Therapist 2
          <button type="button" class="delete-btn" onclick="deleteTherapist(this)">Delete</button>
        </div>
      </div>
      <button type="button" onclick="addTherapist()">Add Therapist</button>

      <button type="submit">Submit</button>
    </form>

    <div id="totalAmount"></div>

    <h2>Reports</h2>
    <button id="dailyReport">Generate Daily Report</button>
    <button id="weeklyReport">Generate Weekly Report</button>
    <button id="monthlyReport">Generate Monthly Report</button>

    <div id="reportSection">
      <div id="reportResult"></div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
