<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spa Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ngalula Beauty Spa Inventory System</h1>
    <form id="clientForm">
      <label for="name">Client Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" required>

      <label for="birthday">Birthday:</label>
      <input type="date" id="birthday" required>

      <label for="paymentMethod">Payment Method:</label>
      <select id="paymentMethod" required>
        <option value="">Select payment method</option>
        <option value="cash">Cash</option>
        <option value="credit">Credit Card</option>
        <option value="mobile">Mobile Money</option>
        <option value="ewallet">E-Wallet</option>
        <option value="pay2cell">Pay2Cell</option>
      </select>

      <label>Services:</label>
      <div id="servicesList">
        <div class="service-item">
          <input type="checkbox" name="services" value="massage" data-price="500"> Massage (500 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
        <div class="service-item">
          <input type="checkbox" name="services" value="facial" data-price="400"> Facial (400 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
        <div class="service-item">
          <input type="checkbox" name="services" value="manicure" data-price="300"> Manicure (300 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
        <div class="service-item">
          <input type="checkbox" name="services" value="pedicure" data-price="350"> Pedicure (350 ZMW)
          <button type="button" class="delete-btn" onclick="deleteService(this)">Delete</button>
        </div>
      </div>
      <button type="button" onclick="addService()">Add Service</button>

      <label>Therapists:</label>
      <div id="therapistsList">
        <div class="therapist-item">
          <input type="checkbox" name="therapists" value="john"> John
          <button type="button" class="delete-btn" onclick="deleteTherapist(this)">Delete</button>
        </div>
        <div class="therapist-item">
          <input type="checkbox" name="therapists" value="sarah"> Sarah
          <button type="button" class="delete-btn" onclick="deleteTherapist(this)">Delete</button>
        </div>
        <div class="therapist-item">
          <input type="checkbox" name="therapists" value="emma"> Emma
          <button type="button" class="delete-btn" onclick="deleteTherapist(this)">Delete</button>
        </div>
      </div>
      <button type="button" onclick="addTherapist()">Add Therapist</button>

      <button type="submit">Submit</button>
    </form>

    <div id="totalAmount"></div>

    <div id="reportSection">
      <h2>Financial Report</h2>
      <button id="dailyReport">Daily Report</button>
      <button id="weeklyReport">Weekly Report</button>
      <button id="monthlyReport">Monthly Report</button>
      <div id="reportResult"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
</body>
</html>
